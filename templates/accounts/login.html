{% extends "base.html" %}

{% block title %}Connexion{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="auth-header">
        <i class="bi bi-key" style="font-size: 3rem; color: #3498db;"></i>
        <h2>Connexion</h2>
        <p>Connectez-vous à votre compte</p>
    </div>
    
    <form method="post">
        {% csrf_token %}
        <div class="form-group">
            <label><i class="bi bi-person"></i> Nom d'utilisateur</label>
            <input type="text" name="username" required placeholder="Entrez votre nom d'utilisateur">
        </div>
        
        <div class="form-group">
            <label><i class="bi bi-lock"></i> Mot de passe</label>
            <input type="password" name="password" required placeholder="Entrez votre mot de passe">
        </div>
        
        <button type="submit" class="btn-login">
            <i class="bi bi-box-arrow-in-right"></i> Se connecter
        </button>
    </form>
    
    <div class="auth-footer">
        <p>Pas encore de compte ? <a href="{% url 'register' %}">Inscription</a></p>
    </div>
</div>

<style>
.auth-container {
    max-width: 450px;
    margin: 3rem auto;
    background: white;
    border-radius: 20px;
    padding: 2rem;
    box-shadow: 0 10px 40px rgba(0,0,0,0.1);
}

.auth-header {
    text-align: center;
    margin-bottom: 2rem;
}

.auth-header h2 {
    margin: 1rem 0 0.5rem;
    color: #2c3e50;
}

.form-group {
    margin-bottom: 1.5rem;
}

.form-group label {
    display: block;
    margin-bottom: 0.5rem;
    font-weight: 500;
    color: #2c3e50;
}

.form-group input {
    width: 100%;
    padding: 0.75rem;
    border: 1px solid #ddd;
    border-radius: 10px;
    font-size: 1rem;
    transition: all 0.3s;
}

.form-group input:focus {
    outline: none;
    border-color: #3498db;
    box-shadow: 0 0 5px rgba(52,152,219,0.3);
}

.btn-login {
    width: 100%;
    background: linear-gradient(135deg, #3498db, #2980b9);
    color: white;
    padding: 0.75rem;
    border: none;
    border-radius: 10px;
    font-size: 1rem;
    font-weight: bold;
    cursor: pointer;
    transition: all 0.3s;
}

.btn-login:hover {
    transform: translateY(-2px);
    box-shadow: 0 5px 15px rgba(52,152,219,0.3);
}

.auth-footer {
    text-align: center;
    margin-top: 1.5rem;
    padding-top: 1rem;
    border-top: 1px solid #ecf0f1;
}

.auth-footer a {
    color: #3498db;
    text-decoration: none;
    font-weight: bold;
}

.auth-footer a:hover {
    text-decoration: underline;
}
</style>
{% endblock %}
